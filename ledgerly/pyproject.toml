[project]
name = "ledgerly"
version = "0.4.2"
description = "Invoicing and refunds API (workshop sample project)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "mcp>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not landmine'"
markers = [
    "landmine: deliberately flaky/problematic test used by later workshop exercises",
    "req(id): links a test to a spec requirement id, e.g. FR-001 (used in Lesson 2)",
]

[tool.mypy]
python_version = "3.11"
strict = false
mypy_path = "src"
